# Directories that packages ship under /var. bootc images must not carry /var
# content, so they are removed at build time and recreated here at boot.
d /var/lib/blueman 0755 root root - -

# 1Password lives in /usr/lib/1Password (see build.sh); its binaries, desktop
# entry and polkit policy still expect /opt/1Password, and /opt is /var/opt.
L /var/opt/1Password - - - - /usr/lib/1Password
